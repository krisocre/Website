  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: start; fill: #19323a" x="56.16" y="68.4288" transform="rotate(-0 56.16 68.4288)">Google corrected its 2024 reporting inputs.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: start; fill: #56656a" x="56.16" y="97.4592" transform="rotate(-0 56.16 97.4592)">The March 2026 notice changed both place-edit counts; use one source version consistently.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: start; fill: #56656a" x="56.16" y="486.2592" transform="rotate(-0 56.16 486.2592)">Sources: Google Maps transparency report and correction notice; checked October 24, 2026. Global, not a Canadian sample.</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: start; fill: #56656a" x="56.16" y="502.3296" transform="rotate(-0 56.16 502.3296)">Original compilation and calculations: ReviewRemoval / CC BY 4.0. Display precision and inequalities are preserved in the dataset.</text>
  </g>
  <g id="text_20">
   <text style="font-size: 11px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: start; fill: #19323a" x="56.16" y="414.72" transform="rotate(-0 56.16 414.72)">A separate correction changes the harm bound: &lt;0.01% → &lt;0.1% of all contributed reviews.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: start; fill: #56656a" x="56.16" y="438.048" transform="rotate(-0 56.16 438.048)">That is a less restrictive upper bound, not evidence of a tenfold increase in actual harmful reviews.</text>
  </g>
