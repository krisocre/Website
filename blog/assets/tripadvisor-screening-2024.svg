<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="672" viewBox="0 0 1200 672" role="img" aria-labelledby="title desc"><title id="title">Three initial outcomes, one separate measure</title><desc id="desc">A disjoint initial automated split and a separate human-moderation metric.</desc><style>text{font-family:Arial,sans-serif;fill:#17353e}.serif{font-family:Georgia,serif}.muted{fill:#61736e}.white{fill:#fff}.accent{fill:#b56142}</style><rect width="1200" height="672" fill="#f7f3ec"/><rect x="24" y="24" width="6" height="624" fill="#bb6949"/><text x="66" y="65" font-size="14" letter-spacing="2" class="accent">REVIEWREMOVAL / RESEARCH</text><text x="66" y="112" font-size="37" class="serif">Three initial outcomes, one separate measure</text><text x="66" y="153" font-size="19" class="muted">The initial automated split totals 100%. Human moderation is a separate process measure.</text><rect x="66" y="212" width="937.704" height="85" fill="#17353e"/><rect x="1003.704" y="212" width="77.964" height="85" fill="#bb6949"/><rect x="1081.668" y="212" width="52.33200000000001" height="85" fill="#7c9790"/><text x="91" y="264" font-size="27" class="white">87.8% met automation standards</text><rect x="66" y="329" width="17" height="17" fill="#17353e"/><text x="93" y="344" font-size="23" >87.8%</text><text x="66" y="382" font-size="18" class="muted">Met automation standards</text><rect x="431" y="329" width="17" height="17" fill="#bb6949"/><text x="458" y="344" font-size="23" >7.3%</text><text x="431" y="382" font-size="18" class="muted">Rejected by technology</text><rect x="796" y="329" width="17" height="17" fill="#7c9790"/><text x="823" y="344" font-size="23" >4.9%</text><text x="796" y="382" font-size="18" class="muted">Flagged for further review</text><rect x="66" y="430" width="1068" height="103" fill="#eaf0ed" stroke="#7c9790" stroke-dasharray="6 5"/><text x="91" y="473" font-size="29" class="serif">13.5% human moderated</text><text x="91" y="508" font-size="19" class="muted">Before OR after posting. Do not add this to the initial 100% split.</text><text x="66" y="590" font-size="18" class="muted">Flagged, rejected and moderated describe processes; they do not all mean “fake”.</text><text x="66" y="626" font-size="16" class="muted">Source: Tripadvisor, March 18, 2025 release, covering 2024 activity. Diagram by ReviewRemoval.</text></svg>
