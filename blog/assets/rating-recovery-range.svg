  </g>
  <g id="text_26">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #61736e" x="60.48" y="90.47808" transform="rotate(-0 60.48 90.47808)">New genuine 5-star ratings needed for an unrounded 4.5 average, using every attainable starting total.</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #61736e" x="60.48" y="449.00352" transform="rotate(-0 60.48 449.00352)">Assumes equally weighted whole-star ratings and nearest-tenth, half-up rounding; Google does not confirm the tie rule.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #61736e" x="60.48" y="468.35712" transform="rotate(-0 60.48 468.35712)">Calculated scenarios, not observed outcomes. ReviewRemoval, 8 October 2026 / CC BY 4.0. Download data and methods in the article.</text>
  </g>
  <g id="text_29">
