<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="672" viewBox="0 0 1200 672" role="img" aria-labelledby="title desc"><title id="title">Where did the matched Yelp reviews move?</title><desc id="desc">Endpoint recommendation transitions; changing classification is distinct from deletion.</desc><style>text{font-family:Arial,sans-serif;fill:#17353e}.serif{font-family:Georgia,serif}.muted{fill:#61736e}.white{fill:#fff}.accent{fill:#b56142}</style><rect width="1200" height="672" fill="#f7f3ec"/><rect x="24" y="24" width="6" height="624" fill="#bb6949"/><text x="66" y="65" font-size="14" letter-spacing="2" class="accent">REVIEWREMOVAL / RESEARCH</text><text x="66" y="112" font-size="37" class="serif">Where did the matched Yelp reviews move?</text><text x="66" y="153" font-size="19" class="muted">Matched reviews present in both 2012 and 2020 snapshots; each row has a separate denominator.</text><rect x="66" y="185" width="17" height="17" fill="#17353e"/><text x="93" y="199" font-size="17" >Same state at both endpoints</text><rect x="420" y="185" width="17" height="17" fill="#bb6949"/><text x="447" y="199" font-size="17" >Changed state</text><text x="66" y="258" font-size="22" class="serif">Recommended in 2012</text><text x="66" y="291" font-size="17" class="muted">58,297 matched reviews</text><rect x="370" y="230" width="672.995179854881" height="68" fill="#17353e"/><rect x="1042.995179854881" y="230" width="27.00482014511897" height="68" fill="#bb6949"/><text x="386" y="272" font-size="20" class="white">96.14% same state</text><text x="1070" y="335" font-size="20" text-anchor="end" class="accent">2,249 changed (3.86%)</text><text x="66" y="418" font-size="22" class="serif">Not recommended in 2012</text><text x="66" y="451" font-size="17" class="muted">8,625 matched reviews</text><rect x="370" y="390" width="410.5855072463768" height="68" fill="#17353e"/><rect x="780.5855072463768" y="390" width="289.4144927536232" height="68" fill="#bb6949"/><text x="386" y="432" font-size="20" class="white">58.66% same state</text><text x="1070" y="495" font-size="20" text-anchor="end" class="accent">3,566 changed (41.34%)</text><path d="M66 552H1134" stroke="#cbd5cf"/><text x="66" y="584" font-size="18" class="muted">A historical US sample. These are not deletion rates or predictions for Canadian listings.</text><text x="66" y="619" font-size="16" class="muted">Source: Amos et al., Reviews in Motion (2022), Table II. Percentages calculated by ReviewRemoval.</text></svg>
