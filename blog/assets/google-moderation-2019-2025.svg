<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Google Maps policy violating review moderation, reported annual figures, 2019 to 2025</title>
  <desc id="desc">Bar chart in millions: 2019 more than 75, 2020 55, 2021 more than 95, 2022 more than 115, 2023 more than 170, 2024 more than 240, and 2025 more than 292. Figures are rounded and most are lower bounds.</desc>
  <rect width="1000" height="560" fill="#f7f3ec"/>
  <text x="62" y="66" fill="#17353e" font-family="Georgia,serif" font-size="31">Google Maps review moderation, 2019–2025</text>
  <text x="62" y="96" fill="#586b6c" font-family="Arial,sans-serif" font-size="14">Published annual headline counts · millions of policy violating reviews acted on</text>
  <g stroke="#d5ded9" stroke-width="1">
    <line x1="95" y1="419" x2="949" y2="419"/><line x1="95" y1="346" x2="949" y2="346"/><line x1="95" y1="273" x2="949" y2="273"/><line x1="95" y1="200" x2="949" y2="200"/><line x1="95" y1="127" x2="949" y2="127"/>
  </g>
  <g fill="#63736f" font-family="Arial,sans-serif" font-size="12" text-anchor="end">
    <text x="82" y="423">0</text><text x="82" y="350">75</text><text x="82" y="277">150</text><text x="82" y="204">225</text><text x="82" y="131">300</text>
  </g>
  <g fill="#55747a">
    <rect x="125" y="346" width="72" height="73"/><rect x="241" y="365" width="72" height="54"/><rect x="357" y="327" width="72" height="92"/><rect x="473" y="307" width="72" height="112"/><rect x="589" y="254" width="72" height="165"/><rect x="705" y="185" width="72" height="234"/>
  </g>
  <rect x="821" y="135" width="72" height="284" fill="#bf6344"/>
  <g fill="#17353e" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="161" y="335">75m+</text><text x="277" y="354">55m</text><text x="393" y="316">95m+</text><text x="509" y="296">115m+</text><text x="625" y="243">170m+</text><text x="741" y="174">240m+</text><text x="857" y="124">292m+</text>
  </g>
  <g fill="#17353e" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><text x="161" y="447">2019</text><text x="277" y="447">2020</text><text x="393" y="447">2021</text><text x="509" y="447">2022</text><text x="625" y="447">2023</text><text x="741" y="447">2024</text><text x="857" y="447">2025</text></g>
  <line x1="62" y1="478" x2="938" y2="478" stroke="#cbd5d0"/>
  <text x="62" y="505" fill="#56666a" font-family="Arial,sans-serif" font-size="12">+ marks a lower bound. 2019: removed; 2020–2025: blocked or removed. Bars plot stated rounded values.</text>
  <text x="62" y="526" fill="#56666a" font-family="Arial,sans-serif" font-size="12">Source: Google Maps annual updates for 2019–2025. Compiled by ReviewRemoval, September 2026.</text>
</svg>
